name: Feature request
description: Suggest an improvement or missing endpoint
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the use case rather than the implementation.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like the client to do?

  - type: input
    id: endpoint
    attributes:
      label: Related API endpoint
      description: If this is about missing coverage, which endpoint?
      placeholder: 'GET /v1/companies/{company_number}/…'
