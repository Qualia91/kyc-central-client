name: CI — Elixir

on:
  push:
    branches: [main]
    paths:
      - "elixir/**"
  pull_request:
    paths:
      - "elixir/**"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    concurrency:
      group: ci-elixir-${{ matrix.elixir-version }}-${{ github.ref }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        # mix.exs requires elixir "~> 1.15".
        include:
          - elixir-version: "1.15"
            otp-version: "26.2"
          - elixir-version: "1.16"
            otp-version: "26.2"
          - elixir-version: "1.17"
            otp-version: "27.3"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir ${{ matrix.elixir-version }} / OTP ${{ matrix.otp-version }}
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir-version }}
          otp-version: ${{ matrix.otp-version }}
          rebar3-mk: true

      - name: Install dependencies
        run: mix deps.get
        working-directory: elixir

      - name: Run tests with coverage
        run: mix coveralls.json
        working-directory: elixir
        env:
          MIX_ENV: test

      - name: Format check
        run: mix format --check-formatted
        working-directory: elixir

      - name: Lint (credo)
        run: mix credo --strict
        working-directory: elixir

      - name: Dialyzer
        run: mix dialyzer
        working-directory: elixir

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: elixir/cover/excoveralls.json
          flags: elixir
          fail_ci_if_error: false
