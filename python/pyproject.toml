[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kyccentral"
dynamic = ["version"]
description = "Official Python client for the KYC Central API — UK company KYC and AML risk assessment."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "KYC Central", email = "support@kyccentral.co.uk" }]
keywords = [
    "kyc",
    "aml",
    "compliance",
    "companies-house",
    "sanctions",
    "due-diligence",
    "uk",
    "risk-assessment",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.24,<1"]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "respx>=0.20",
    "mypy>=1.8",
    "ruff>=0.4",
    "pytest-cov",
    "pip-audit",
]

[project.urls]
Homepage = "https://kyccentral.co.uk"
Documentation = "https://github.com/qualia91/kyccentral-python#readme"
Repository = "https://github.com/qualia91/kyccentral-python"
Issues = "https://github.com/qualia91/kyccentral-python/issues"
Changelog = "https://github.com/qualia91/kyccentral-python/blob/main/CHANGELOG.md"
"API Reference" = "https://kyccentral.co.uk/api-docs"

[tool.hatch.version]
path = "src/kyccentral/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/kyccentral"]

[tool.hatch.build.targets.sdist]
include = ["src/kyccentral", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error"]
addopts = ["--cov=kyccentral", "--cov-report=term-missing", "--cov-report=xml"]

[tool.coverage.run]
source = ["kyccentral"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]

ignore = [
    # The API mirrors upstream registry payloads; `dict[str, Any]` aliases are
    # deliberate rather than lazy typing.
    "RUF012",
]

[tool.ruff.lint.per-file-ignores]
# Nested `with client: with pytest.raises(...)` reads better than one long
# combined line, and keeps the assertion visually attached to the call.
"tests/*" = ["B008", "SIM117"]

[tool.mypy]
python_version = "3.10"
files = ["src/kyccentral"]
strict = true
warn_unreachable = true
# Resource methods hand back decoded JSON, so the transport necessarily returns
# `Any`. The `dict[str, Any]` annotations on those methods document the shape
# callers get without pretending this client validates it — narrowing each one
# with a `cast` would add no safety, only noise.
warn_return_any = false