name: Publish to Hex

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    environment:
      name: hex
      url: https://hex.pm/packages/kyccentral
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18"
          otp-version: "27"

      - run: mix deps.get

      - name: Verify before publishing
        run: |
          mix compile --warnings-as-errors
          mix format --check-formatted
          mix credo --strict
          mix test

      - name: Publish
        run: mix hex.publish --yes
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
